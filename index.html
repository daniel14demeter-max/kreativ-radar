tr.kat:hover{background:var(--p2);cursor:pointer}
.c{font-size:11px;color:var(--m)}
.jel{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600}
.s-g{background:#16382a;color:var(--g)}.s-y{background:#3d3512;color:var(--y)}.s-o{background:#47290f;color:var(--o)}.s-r{background:#44161d;color:var(--r)}.s-n{background:#272d3a;color:var(--m)}

.doboz{background:var(--p);border:1px solid var(--l);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.doboz h3{margin:0 0 6px;font-size:15px}.doboz ul{margin:6px 0 0 18px;padding:0}
.fel{position:fixed;inset:0 0 0 auto;width:min(760px,100%);background:var(--bg);border-left:1px solid var(--l);overflow:auto;padding:16px 18px;z-index:10;box-shadow:-10px 0 30px #0008}
.fel.rejt{display:none}
img.kep{width:42px;height:42px;object-fit:cover;border-radius:6px;vertical-align:middle;margin-right:8px;background:var(--p2)}
.hiba{background:#44161d;border:1px solid var(--r);padding:12px;border-radius:10px}
.sugo{color:var(--m);font-size:13px;margin:8px 0}
@media(max-width:700px){th{top:0}}

table{display:block;overflow-x:auto}</style></head><body>

const $=s=>document.querySelector(s);
const fmt=(n,d=0)=>n==null||!isFinite(n)?'–':n.toLocaleString('hu-HU',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=n=>n==null||!isFinite(n)?'–':fmt(n*100,2)+'%';
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const nap=(n)=>{const d=new Date(ALL.to+'T12:00:00');d.setDate(d.getDate()-n);return d};
const PRESET={'Ma':[0,0],'Tegnap':[1,1],'Elmúlt 3 nap':[2,0],'Elmúlt 7 nap':[6,0],'Elmúlt 10 nap':[9,0],'Elmúlt 14 nap':[13,0],'Elmúlt 30 nap':[29,0]};
let D=null,S={from:iso(nap(6)),to:iso(nap(0)),fül:'kreativok',rend:'spend',irany:-1,preset:'Elmúlt 7 nap'};
try{Object.assign(S,JSON.parse(localStorage.getItem('radar')||'{}'))}catch{}
const mentes=()=>{try{localStorage.setItem('radar',JSON.stringify({from:S.from,to:S.to,preset:S.preset,cpa:$('#cpa').value,csop:$('#csop').value,szuro:$('#szuro').value}))}catch{}};

// ---------- számítás ----------
const NULLA=()=>({spend:0,impr:0,reach:0,clicks:0,purch:0,value:0,plays3:0,thru:0,lpv:0,atc:0,ic:0});
const add=(a,r)=>{for(const k in a)a[k]+=r[k]||0;return a};
const der=a=>({...a,cpa:a.purch?a.spend/a.purch:null,roas:a.spend?a.value/a.spend:null,cpm:a.impr?a.spend/a.impr*1000:null,ctr:a.impr?a.clicks/a.impr:null,cpc:a.clicks?a.spend/a.clicks:null,cvr:a.clicks?a.purch/a.clicks:null,hook:a.impr?a.plays3/a.impr:null,hold:a.plays3?a.thru/a.plays3:null,lpvr:a.clicks?a.lpv/a.clicks:null,atcr:a.lpv?a.atc/a.lpv:null,icr:a.atc?a.ic/a.atc:null,pur_ic:a.ic?a.purch/a.ic:null});
function kulcs(r){const m=$('#csop').value;return m==='ad'?r.ad_id:m==='kreativ'?r.ad:m==='adset'?r.adset_id:r.campaign_id}
function nev(r){const m=$('#csop').value;return m==='ad'||m==='kreativ'?r.ad:m==='adset'?r.adset:r.campaign}
function aktiv(r){const s=D.statusz[r.ad_id];return s&&s.ad==='ACTIVE'&&s.adset==='ACTIVE'&&s.kampany==='ACTIVE'}

function csoportok(){
  const cpa=+$('#cpa').value||20,G={};
  const napok=[...new Set(D.napi.map(r=>r.nap))].sort();
  const N=Math.min(3,Math.max(1,Math.floor(napok.length/3))),vag=napok[napok.length-N];
  for(const r of D.napi){
    const k=kulcs(r);
    const g=G[k]??={kulcs:k,nev:nev(r),campaign:r.campaign,adset:r.adset,ids:new Set(),ossz:NULLA(),regi:NULLA(),uj:NULLA(),napi:{},aktiv:false,kep:null};
    g.ids.add(r.ad_id);add(g.ossz,r);add(r.nap>=vag?g.uj:g.regi,r);
    add(g.napi[r.nap]??=NULLA(),r);
    if(aktiv(r))g.aktiv=true;
    g.kep??=D.statusz[r.ad_id]?.kep;
  }
  // frekvencia: a teljes időszakra a Meta saját (egyedi elérésből számolt) értéke, csoportnál súlyozott átlag
  const F={};for(const r of D.ossz){const k=kulcs(r);(F[k]??={s:0,i:0}).s+=r.freq*r.impr;F[k].i+=r.impr}
  const lista=Object.values(G).map(g=>{
    const o=der(g.ossz),a=der(g.regi),b=der(g.uj);
    const freq=F[g.kulcs]?.i?F[g.kulcs].s/F[g.kulcs].i:null;
    return{...g,...o,freq,regiD:a,ujD:b,N,vag,elemzes:ertekel(o,a,b,cpa,freq,g)};
  });
  return lista.filter(g=>$('#szuro').value==='aktiv'?g.aktiv&&g.spend>0:g.spend>0);
}

// CPA = CPM/1000 / (CTR · CVR)  →  ln(CPA_új/CPA_régi) = ln(CPM) − ln(CTR) − ln(CVR) változása. Pontos felbontás.
function ertekel(o,a,b,cpa,freq,g){
  const min=Math.max(10,cpa);
  const e={szint:'n',cimke:'Kevés adat',ok:null,hatas:null,szab:[]};
  if(o.spend<min*0.5){e.szab.push('adat');return e}
  const rosszKiado=o.spend>=cpa*2&&o.purch===0;
  const elegA=a.spend>=cpa*0.8&&a.purch>0,elegB=b.spend>=cpa*0.8;
  let romlik=false;
  if(elegA&&elegB&&b.purch>0&&a.cpa&&b.cpa&&a.ctr&&b.ctr&&a.cvr&&b.cvr&&a.cpm&&b.cpm){
    const h={cpm:Math.log(b.cpm/a.cpm),ctr:-Math.log(b.ctr/a.ctr),cvr:-Math.log(b.cvr/a.cvr)};
    const t=Math.log(b.cpa/a.cpa);e.valt=b.cpa/a.cpa-1;e.hatas=h;
    if(t>0.2){romlik=true;const nagy=Object.entries(h).sort((x,y)=>y[1]-x[1])[0][0];e.ok=nagy;}
  } else if(elegA&&elegB&&b.purch===0&&b.spend>=cpa*1.2&&a.purch>0){romlik=true;e.ok='cvr';e.valt=Infinity}
  if(rosszKiado||(o.purch>0&&o.cpa>cpa*1.6&&o.spend>=cpa*2)){e.szint='r';e.cimke='Leállítási jelölt';e.szab.push('kill')}
  else if(romlik){e.szint='o';e.cimke='Gyengül';e.szab.push('gyengul')}
  else if(o.purch>=3&&o.cpa<=cpa&&(!b.cpa||b.cpa<=cpa*1.25)){e.szint='g';e.cimke='Skálázható';e.szab.push('skala')}
  else if(o.purch>0&&o.cpa<=cpa*1.25){e.szint='g';e.cimke='Jó, de még kevés';e.szab.push('figyel')}
  else{e.szint='y';e.cimke='Figyelni';e.szab.push('figyel')}
  if(freq&&freq>=3&&e.szint!=='g')e.szab.push('freq');
  return e;
}

  cpm:['Drágul az elérés (CPM nő)','Az aukció drágább lett, vagy a közönség telítődik. Nézd a frekvenciát: ha 2,5 fölött van, a közönség „kifogy”, ha alacsony, akkor aukciós/szezonális drágulás (a kreatívot nem érdemes emiatt leállítani).'],

  cvr:['Kattintás után kevesebben vesznek (CVR esik)','A hirdetés rendben van, a kattintók viszont nem vásárolnak. Gyanú: oldal, ár, szállítás, készlet, vagy mást ígér a hirdetés, mint amit az oldal ad. Először a Shopify-oldalt és a rendeléseket nézd, ne a kreatívot.']
};

// ---------- megjelenítés ----------
function render(){
  if(!D)return;
  const L=csoportok();
  const T=der(L.reduce((a,g)=>add(a,g.ossz),NULLA()));
  $('#allapot').textContent=`${D.from} → ${D.to} · frissítve ${new Date(D.frissitve).toLocaleTimeString('hu-HU')}`;
  $('#fulek').innerHTML=[['kreativok','Kreatívok'],['gyenge','Mi gyengül és miért'],['szabaly','Szabálykönyv']].map(([k,n])=>`<button class="${S.fül===k?'on':''}" data-f="${k}">${n}</button>`).join('');
  $('#fulek').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.fül=b.dataset.f;render()});
  if(S.fül==='kreativok')$('#tartalom').innerHTML=kartyak(T,L)+tabla(L);
  else if(S.fül==='gyenge')$('#tartalom').innerHTML=gyengeNezet(L);
  else $('#tartalom').innerHTML=szabalyNezet();
  document.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{const k=th.dataset.k;S.irany=S.rend===k?-S.irany:-1;S.rend=k;render()});
  document.querySelectorAll('tr.kat').forEach(tr=>tr.onclick=()=>reszlet(tr.dataset.k));
}
function kartyak(T,L){
  const db=s=>L.filter(g=>g.elemzes.szint===s).length;
  const c=+$('#cpa').value||20;
  return `<div class="kartyak">
  <div class="k"><small>Költés</small><b>${fmt(T.spend)} lej</b></div>
  <div class="k"><small>Vásárlás (Meta)</small><b>${fmt(T.purch)}</b></div>
  <div class="k"><small>CPA</small><b class="${T.cpa<=c?'jo':'rossz'}">${fmt(T.cpa,1)} lej</b></div>
  <div class="k"><small>ROAS</small><b>${fmt(T.roas,2)}</b></div>
  <div class="k"><small>CTR / CPM</small><b>${pct(T.ctr)} / ${fmt(T.cpm,1)}</b></div>
  <div class="k"><small>🟢 skálázható</small><b>${db('g')}</b></div>
  <div class="k"><small>🟠 gyengül</small><b>${db('o')}</b></div>
  <div class="k"><small>🔴 leállítási jelölt</small><b>${db('r')}</b></div></div>
  <p class="sugo">A Meta a Shopify-rendelések kb. 72%-át látja, ezért a CPA itt jellemzően kedvezőtlenebb a valóságnál. A szín csak <b>javaslat</b> – a döntés a Shopify-tény alapján a tiéd, az app semmit nem állít a Metában.</p>`;
}
const OSZLOP=[['nev','Kreatív'],['szint','Javaslat'],['spend','Költés'],['purch','Vás.'],['cpa','CPA'],['roas','ROAS'],['cpm','CPM'],['ctr','CTR'],['cvr','CVR'],['hook','Hook 3mp'],['hold','Tartás'],['freq','Frekv.'],['trend','CPA-változás']];
const SZ={r:0,o:1,y:2,n:3,g:4};
function tabla(L){
  const c=+$('#cpa').value||20,k=S.rend,ir=S.irany;
  const val=g=>k==='nev'?g.nev:k==='szint'?SZ[g.elemzes.szint]:k==='trend'?(g.elemzes.valt??-9):g[k];
  L=[...L].sort((a,b)=>{const x=val(a),y=val(b);if(x==null)return 1;if(y==null)return -1;return (x>y?1:x<y?-1:0)*ir});
  const jo=(v,hat,fordit)=>v==null?'':(fordit?v<=hat:v>=hat)?'jo':'rossz';
  return `<table><thead><tr>${OSZLOP.map(([a,b])=>`<th data-k="${a}">${b}${S.rend===a?(S.irany>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>`+
  L.map(g=>`<tr class="kat" data-k="${esc(g.kulcs)}"><td>${g.kep?`<img class="kep" src="${g.kep}" loading="lazy">`:''}${esc(g.nev)}<div class="c">${esc($('#csop').value==='campaign'?'':g.campaign||'')}${g.ids.size>1?` · ${g.ids.size} hirdetés`:''}</div></td>
  <td><span class="jel s-${g.elemzes.szint}">${g.elemzes.cimke}</span></td>
  <td>${fmt(g.spend)}</td><td>${fmt(g.purch)}</td><td class="${jo(g.cpa,c,1)}">${fmt(g.cpa,1)}</td><td>${fmt(g.roas,2)}</td><td>${fmt(g.cpm,1)}</td>
  <td class="${jo(g.ctr,0.02)}">${pct(g.ctr)}</td><td>${pct(g.cvr)}</td><td class="${jo(g.hook,0.3)}">${pct(g.hook)}</td><td class="${jo(g.hold,0.4)}">${pct(g.hold)}</td>
  <td class="${g.freq>=3?'rossz':g.freq>=2.5?'kozep':''}">${fmt(g.freq,2)}</td>
  <td class="${g.elemzes.valt>0.2?'rossz':g.elemzes.valt<-0.2?'jo':''}">${g.elemzes.valt==null?'–':g.elemzes.valt===Infinity?'∞':(g.elemzes.valt>0?'+':'')+fmt(g.elemzes.valt*100)+'%'}</td></tr>`).join('')+`</tbody></table>`;
}
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

function gyengeNezet(L){
  const gy=L.filter(g=>g.elemzes.szint==='o'||g.elemzes.szint==='r').sort((a,b)=>b.spend-a.spend);
  if(!gy.length)return `<div class="doboz"><h3>Nincs gyengülő kreatív ebben az időszakban 🎉</h3>Vagy jól tartják magukat, vagy még kevés az adat. Próbálj hosszabb időszakot (10–14 nap).</div>`;
  const N=gy[0].N;
  return `<p class="sugo">Összehasonlítás: az időszak utolsó <b>${N} napja</b> az azt megelőző napokkal. A CPA = CPM ÷ (CTR × CVR), tehát a romlás mindig a három közül valamelyikből jön – az app megmondja, melyikből.</p>`+
  gy.map(g=>{const e=g.elemzes,o=e.ok?OK_SZOV[e.ok]:null,h=e.hatas;
    return `<div class="doboz"><h3>${esc(g.nev)} <span class="jel s-${e.szint}">${e.cimke}</span></h3>
    <div class="c">${esc(g.campaign||'')} · költés ${fmt(g.spend)} lej · CPA ${fmt(g.cpa,1)} · előtte ${fmt(g.regiD.cpa,1)} → utolsó ${N} nap ${fmt(g.ujD.cpa,1)}</div>
    ${o?`<p><b>Fő ok: ${o[0]}.</b> ${o[1]}</p>`:`<p>A költés ${fmt(g.spend)} lej, de ${g.purch?'a CPA a cél 1,6-szorosa fölött van':'nincs vásárlás'}. Nincs elég adat a trend felbontásához – a szabálykönyv „Leállítási jelölt” pontját kövesd.</p>`}
    ${h?`<div class="c">Hatás a CPA-ra (log-felbontás): CPM ${h.cpm>=0?'+':''}${fmt(h.cpm*100)}% · CTR-esés ${h.ctr>=0?'+':''}${fmt(h.ctr*100)}% · CVR-esés ${h.cvr>=0?'+':''}${fmt(h.cvr*100)}%</div>`:''}
    ${g.freq>=2.5?`<div class="c">⚠ Frekvencia ${fmt(g.freq,2)} – a közönség már sokszor látta.</div>`:''}
    <button onclick="reszlet('${esc(g.kulcs)}')">Napi bontás</button></div>`}).join('');
}

function szabalyNezet(){
  const c=+$('#cpa').value||20;
  return `<div class="doboz"><h3>Alapelvek</h3><ul>
  <li>Az app csak olvas. Kampányt kapcsolni, költségkeretet állítani <b>mindig te döntesz</b>, a <b>Shopify-rendelések</b> alapján (a Meta ~72%-ot lát).</li>
  <li>Egyszerre <b>egy dolgot</b> változtass. Az okt. 17-i visszaesés pont attól jött, hogy keretemelés + újrakapcsolás + sok új kampány egyszerre történt.</li>
  <li>Döntés előtt legalább <b>${fmt(c)} lej költés</b> (1 CPA), erős döntéshez ${fmt(c*3)}+ lej. 1–2 nap adatából ne ítélj.</li>
  <li>Keretemelés legfeljebb <b>+20%</b> egyszerre, és utána 48 órát várj.</li></ul></div>
  <div class="doboz"><h3>🟢 Skálázható (CPA ≤ ${fmt(c)} lej, ≥3 vásárlás, nem romlik)</h3><ul>
  <li>Ellenőrizd a Shopifyban, hogy a rendelések is tükrözik-e.</li>
  <li>Keret +20% 48 óránként, vagy a nyertes videó átvitele új adsetbe (a skálázási minta szerint).</li>
  <li>Közben készíts 2–3 iterációt a nyertesből (új hook, ugyanaz a történet), mert a nyertes is el fog fáradni.</li></ul></div>
  <div class="doboz"><h3>🟠 Gyengül – mit tegyél az ok szerint</h3><ul>
  <li><b>CTR esik (kreatív-kifáradás):</b> új hook/nyitókép ugyanarra a termékre; a régit ne töröld, csak vedd vissza a keretet 20–30%-kal, ha a CPA a cél 1,3-szerese fölött van.</li>
  <li><b>CPM nő (drága aukció/telítődés):</b> ha a frekvencia 2,5 fölött: új közönség vagy új kreatív. Ha alacsony: szezon/aukció – várj 2–3 napot, ne nyúlj hozzá.</li>
  <li><b>CVR esik (oldal/ajánlat):</b> a kreatívot hagyd békén. Nézd: oldal betölt-e, ár, készlet, szállítás, kosár→fizetés lépcső. Csak a Shopify-rendelések alapján ítélj.</li>
  <li>Ha 3 napja romlik és a CPA a cél 1,5-szerese fölött van: vedd vissza a keretet, vagy kapcsold ki (te döntesz).</li></ul></div>
  <div class="doboz"><h3>🔴 Leállítási jelölt</h3><ul>
  <li>Költés ≥ ${fmt(c*2)} lej és nincs vásárlás, <b>vagy</b> CPA > ${fmt(c*1.6,1)} lej ≥ ${fmt(c*2)} lej költésnél.</li>
  <li>Előbb a Shopifyban nézd meg, tényleg nincs-e rendelés (a Meta lemarad). Ha nincs: kikapcsolás, és a tanulságot írd a trackerbe.</li>
  <li>Ha a hook% jó (≥30%), de nincs vásárlás: az ígéret és az oldal nem egyezik – ezt javítsd, ne új videót gyárts.</li></ul></div>
  <div class="doboz"><h3>Mérőszámok iránytűje</h3><ul>
  <li><b>Hook 3mp ≥ 30%</b> jó · <b>Tartás ≥ 40%</b> jó · <b>CTR ≥ 2%</b> jó · <b>Frekvencia &gt; 2,5</b> figyelmeztető, <b>&gt; 3</b> telítettség.</li>
  <li>CPA = CPM ÷ 1000 ÷ (CTR × CVR). Ha csak egy szám romlik, tudod, mit kell javítani: aukció (CPM), kreatív (CTR), oldal (CVR).</li>
  <li>Hook gyenge → első 3 mp. Tartás gyenge → történet közepe. CTR gyenge → ajánlat/CTA. CVR gyenge → oldal.</li></ul></div>`;
}

function reszlet(k){
  const g=csoportok().find(x=>String(x.kulcs)===String(k));if(!g)return;
  const napok=Object.keys(g.napi).sort().map(n=>({nap:n,...der(g.napi[n])}));
  const e=g.elemzes;
  $('#fel').innerHTML=`<button onclick="$('#fel').classList.add('rejt')" style="float:right">✕ Bezár</button>
  <h2 style="margin:0 0 4px">${esc(g.nev)}</h2><div class="c">${esc(g.campaign||'')} · ${esc(g.adset||'')}</div>
  <p><span class="jel s-${e.szint}">${e.cimke}</span> ${e.ok?`<b>${OK_SZOV[e.ok][0]}.</b> ${OK_SZOV[e.ok][1]}`:''}</p>
  <div class="kartyak"><div class="k"><small>Költés</small><b>${fmt(g.spend)}</b></div><div class="k"><small>CPA</small><b>${fmt(g.cpa,1)}</b></div><div class="k"><small>ROAS</small><b>${fmt(g.roas,2)}</b></div><div class="k"><small>Frekvencia</small><b>${fmt(g.freq,2)}</b></div></div>
  <div class="doboz"><h3>Napi trend</h3><select id="mut"><option value="cpa">CPA</option><option value="ctr">CTR</option><option value="cpm">CPM</option><option value="cvr">CVR</option><option value="hook">Hook</option><option value="spend">Költés</option></select><div id="grafikon"></div></div>
  <div class="doboz"><h3>Vásárlási lépcső (időszak)</h3>Kattintás ${fmt(g.clicks)} → oldal ${fmt(g.lpv)} (${pct(g.lpvr)}) → kosár ${fmt(g.atc)} (${pct(g.atcr)}) → fizetés ${fmt(g.ic)} (${pct(g.icr)}) → vásárlás ${fmt(g.purch)} (${pct(g.pur_ic)})</div>
  <table><thead><tr><th>Nap</th><th>Költés</th><th>Vás.</th><th>CPA</th><th>CPM</th><th>CTR</th><th>CVR</th><th>Hook</th></tr></thead><tbody>${napok.map(n=>`<tr><td>${n.nap}</td><td>${fmt(n.spend)}</td><td>${fmt(n.purch)}</td><td>${fmt(n.cpa,1)}</td><td>${fmt(n.cpm,1)}</td><td>${pct(n.ctr)}</td><td>${pct(n.cvr)}</td><td>${pct(n.hook)}</td></tr>`).join('')}</tbody></table>`;
  $('#fel').classList.remove('rejt');
  const rajz=()=>{const m=$('#mut').value,P=napok.map(n=>n[m]),v=P.filter(x=>x!=null&&isFinite(x)),W=700,H=150;
    if(!v.length){$('#grafikon').textContent='Nincs adat';return}
    const mx=Math.max(...v)*1.1||1,x=i=>20+i*(W-40)/Math.max(1,P.length-1),y=z=>H-14-(z/mx)*(H-28);
    const pts=P.map((z,i)=>z==null?null:[x(i),y(z)]).filter(Boolean);
    $('#grafikon').innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%"><polyline fill="none" stroke="#4d9fff" stroke-width="2" points="${pts.map(p=>p.join(',')).join(' ')}"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#4d9fff"/>`).join('')}${m==='cpa'?`<line x1="20" x2="${W-20}" y1="${y(+$('#cpa').value)}" y2="${y(+$('#cpa').value)}" stroke="#2ecc71" stroke-dasharray="4"/>`:''}<text x="20" y="12" fill="#8e99ad" font-size="11">max: ${m==='ctr'||m==='cvr'||m==='hook'?pct(mx/1.1):fmt(mx/1.1,1)}</text><text x="20" y="${H-1}" fill="#8e99ad" font-size="11">${napok[0].nap}</text><text x="${W-90}" y="${H-1}" fill="#8e99ad" font-size="11">${napok.at(-1).nap}</text></svg>`};
  $('#mut').onchange=rajz;rajz();
}

async function betolt(){const n=ALL.napi.filter(r=>r.nap>=S.from&&r.nap<=S.to);D={...ALL,napi:n,from:S.from,to:S.to,ossz:(S.from===ALL.from&&S.to===ALL.to)?ALL.ossz:[]};render()}
function beallit(from,to,preset){S.from=from;S.to=to;S.preset=preset||'';$('#tol').value=from;$('#ig').value=to;
  document.querySelectorAll('#presetek button').forEach(b=>b.classList.toggle('on',b.textContent===S.preset));mentes();betolt()}
$('#presetek').innerHTML=Object.keys(PRESET).map(n=>`<button>${n}</button>`).join('');
document.querySelectorAll('#presetek button').forEach(b=>b.onclick=()=>{const[a,z]=PRESET[b.textContent];beallit(iso(nap(a)),iso(nap(z)),b.textContent)});
$('#alk').onclick=()=>{if($('#tol').value&&$('#ig').value&&$('#tol').value<=$('#ig').value)beallit($('#tol').value,$('#ig').value,'')};

['csop','szuro','cpa'].forEach(i=>$('#'+i).onchange=()=>{mentes();render()});
try{const m=JSON.parse(localStorage.getItem('radar')||'{}');if(m.cpa)$('#cpa').value=m.cpa;if(m.csop)$('#csop').value=m.csop;if(m.szuro)$('#szuro').value=m.szuro}catch{}
if(S.preset&&PRESET[S.preset]){const[a,z]=PRESET[S.preset];S.from=iso(nap(a));S.to=iso(nap(z))}
beallit(S.from,S.to,S.preset);
</script>
